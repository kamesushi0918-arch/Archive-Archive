<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Archive</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Georgia', serif;
        background: #cccccc;
        overflow: hidden;
        user-select: none;
      }
      #intro-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 5000;
        transition:
          opacity 1.5s ease-in-out,
          visibility 1.5s;
        pointer-events: none;
      }
      #digging-container {
        position: relative;
        font-size: 18pt;
        font-weight: 400;
      }
      #digging-bg {
        color: #c0c0c0;
      }
      #digging-fill {
        position: absolute;
        top: 0;
        left: 0;
        color: black;
        overflow: hidden;
        width: 0%;
        transition: width 0.3s ease-out;
        white-space: nowrap;
      }
      #ui-layer {
        position: fixed;
        top: 14px;
        left: 18px;
        font-size: 1rem;
        letter-spacing: -0.01em;
        color: #000;
        z-index: 1000;
        pointer-events: none;
        opacity: 0.5;
      }
      #minimap {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 200px;
        height: 200px;
        background: #cccccc;
        border: 1px solid #999999;
        z-index: 1000;
        pointer-events: none;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  </head>
  <body>
    <div id="intro-overlay">
      <div id="digging-container">
        <span id="digging-bg">Archive digging...</span>
        <div id="digging-fill">Archive digging...</div>
      </div>
    </div>
    <div id="ui-layer">Use arrow keys to move and stay to open</div>
    <canvas id="minimap" width="200" height="200"></canvas>
    <script>
      const SHEET_ID = '19uD7rBe4Ic6nIR-0LJ2anEdeWTZKbR9WlcT-g8wzGx4';
      const GID = '729859851';
      const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;

      let scene, camera, renderer, player;
      let moveKeys = {
        ArrowUp: false,
        ArrowDown: false,
        ArrowLeft: false,
        ArrowRight: false,
      };
      let mainWorldNodes = [],
        mapWorldNodes = [],
        activeNodes = mainWorldNodes;
      let stayStartTime = null,
        isMoving = false,
        isLoaded = false,
        currentTarget = null,
        isInteractionPaused = false;
      let progressMesh, progressTex, progressCanvas, progressCtx;
      const blockGeometry = new THREE.PlaneGeometry(30, 15);
      const textureCache = {};
      const minimapCtx = document.getElementById('minimap').getContext('2d');

      const rawMainChambers = [
        [0, 0, 230],
        [-100, -700, 160],
        [-200, -1150, 130],
        [200, -1050, 100],
        [100, 800, 140],
        [60, 1250, 110],
        [-700, 100, 180],
        [-1200, -60, 150],
        [-1550, 180, 110],
        [900, -100, 170],
        [1400, 50, 145],
        [1750, -130, 100],
        [-480, 520, 100],
        [-900, 720, 85],
        [620, -580, 100],
        [950, -820, 80],
      ];
      const rawMainTunnels = [
        [0, 1, 55],
        [1, 2, 42],
        [1, 3, 38],
        [0, 4, 50],
        [4, 5, 40],
        [0, 6, 60],
        [6, 7, 48],
        [7, 8, 40],
        [0, 9, 58],
        [9, 10, 50],
        [10, 11, 36],
        [0, 12, 42],
        [12, 13, 32],
        [1, 14, 36],
        [14, 15, 28],
      ];
      const rawMapChambers = [
        [0, 0, 180],
        [-240, -190, 105],
        [270, -170, 95],
        [0, 310, 115],
        [-340, 190, 80],
        [340, 240, 78],
        [-110, -390, 88],
        [160, -400, 72],
      ];
      const rawMapTunnels = [
        [0, 1, 50],
        [0, 2, 46],
        [0, 3, 52],
        [1, 4, 36],
        [2, 5, 34],
        [1, 6, 36],
        [2, 7, 30],
        [3, 4, 33],
        [3, 5, 31],
      ];

      let _activeChambers = [],
        _activeTunnels = [];
      let mainFloorGroup, mapFloorGroup, _mainConfig, _mapConfig;

      function colonySDF(x, z, chambers, tunnels) {
        let d = -Infinity;
        if (!chambers || chambers.length === 0) return d;
        for (const [cx, cz, r] of chambers)
          d = Math.max(d, r - Math.hypot(x - cx, z - cz));
        for (const [a, b, hw] of tunnels) {
          if (!chambers[a] || !chambers[b]) continue;
          const ax = chambers[a][0],
            az = chambers[a][1],
            bx = chambers[b][0],
            bz = chambers[b][1];
          const dx = bx - ax,
            dz = bz - az,
            len2 = dx * dx + dz * dz;
          const t =
            len2 > 0
              ? Math.max(0, Math.min(1, ((x - ax) * dx + (z - az) * dz) / len2))
              : 0;
          d = Math.max(d, hw - Math.hypot(x - ax - t * dx, z - az - t * dz));
        }
        return d;
      }

      function isPlayerInside(x, z) {
        return colonySDF(x, z, _activeChambers, _activeTunnels) > 1.5;
      }

      function buildFloorGroup(chambers, tunnels) {
        const group = new THREE.Group();
        const mat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        chambers.forEach(([cx, cz, r]) => {
          const mesh = new THREE.Mesh(new THREE.CircleGeometry(r, 64), mat);
          mesh.rotation.x = -Math.PI / 2;
          mesh.position.set(cx, 0, cz);
          group.add(mesh);
        });
        tunnels.forEach(([a, b, hw]) => {
          const p1 = chambers[a],
            p2 = chambers[b];
          const dx = p2[0] - p1[0],
            dz = p2[1] - p1[1];
          const dist = Math.hypot(dx, dz),
            angle = Math.atan2(dz, dx);
          const mesh = new THREE.Mesh(
            new THREE.PlaneGeometry(dist, hw * 2),
            mat,
          );
          mesh.rotation.x = -Math.PI / 2;
          const pivot = new THREE.Group();
          pivot.position.set((p1[0] + p2[0]) / 2, 0, (p1[1] + p2[1]) / 2);
          pivot.rotation.y = -angle;
          pivot.add(mesh);
          group.add(pivot);
        });
        group.position.y = -0.1;
        return group;
      }

      init();
      animate();

      function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xcccccc);
        const aspect = window.innerWidth / window.innerHeight,
          d = 50;
        camera = new THREE.OrthographicCamera(
          -d * aspect,
          d * aspect,
          d,
          -d,
          1,
          10000,
        );
        camera.position.set(0, 150, 0);
        camera.lookAt(0, 0, 0);
        player = new THREE.Mesh(
          new THREE.CircleGeometry(0.99, 32),
          new THREE.MeshBasicMaterial({ color: 0x000000 }),
        );
        player.rotation.x = -Math.PI / 2;
        player.position.y = 0.5;
        scene.add(player);
        progressCanvas = document.createElement('canvas');
        progressCanvas.width = progressCanvas.height = 128;
        progressCtx = progressCanvas.getContext('2d');
        progressTex = new THREE.CanvasTexture(progressCanvas);
        progressMesh = new THREE.Mesh(
          new THREE.PlaneGeometry(3.96, 3.96),
          new THREE.MeshBasicMaterial({
            map: progressTex,
            transparent: true,
            opacity: 0,
          }),
        );
        progressMesh.rotation.x = -Math.PI / 2;
        progressMesh.position.y = 1.0;
        scene.add(progressMesh);
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);
        window.addEventListener('resize', onWindowResize);
        window.addEventListener('keydown', (e) => {
          if (e.key in moveKeys) {
            moveKeys[e.key] = true;
            isInteractionPaused = false;
          }
        });
        window.addEventListener('keyup', (e) => {
          if (e.key in moveKeys) moveKeys[e.key] = false;
        });
        fetchData();
      }

      function onWindowResize() {
        const aspect = window.innerWidth / window.innerHeight,
          d = 50;
        camera.left = -d * aspect;
        camera.right = d * aspect;
        camera.top = d;
        camera.bottom = -d;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      async function fetchData() {
        try {
          const res = await fetch(CSV_URL);
          const csv = await res.text();
          const rows = csv
            .split('\n')
            .slice(1)
            .filter((r) => r.trim());
          const total = rows.length;
          const fillEl = document.getElementById('digging-fill');
          const overlayEl = document.getElementById('intro-overlay');

          let chamberUsageMain = new Array(rawMainChambers.length).fill(0);
          let chamberUsageMap = new Array(rawMapChambers.length).fill(0);
          let categoryCounts = {};

          for (let i = 0; i < total; i++) {
            const r = rows[i],
              c = r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            const rawCat = c[1]?.replace(/"/g, '').trim().toLowerCase() || '';
            const hasSound = /\bsound\b/.test(rawCat),
              hasSub = /\bsubculture\b/.test(rawCat),
              hasOut = /\boutdoor\b/.test(rawCat),
              isMap = /\bmap\b/.test(rawCat);
            const tArr = isMap ? mapWorldNodes : mainWorldNodes;

            let targetX = 0,
              targetZ = 0,
              baseDist = 0;
            if (!isMap) {
              let dirX = 0,
                dirZ = 0;
              const matchCount = [hasSound, hasSub, hasOut].filter(
                Boolean,
              ).length;
              if (matchCount === 0) {
                targetX = 0;
                targetZ = 0;
                baseDist = 80;
              } else {
                if (hasSound) {
                  dirX -= 0.7;
                  dirZ -= 1;
                }
                if (hasSub) {
                  dirX += 0.7;
                  dirZ -= 1;
                }
                if (hasOut) {
                  dirZ += 1;
                }
                const len = Math.hypot(dirX, dirZ) || 1;
                dirX /= len;
                dirZ /= len;
                baseDist =
                  matchCount === 1 ? 1000 : matchCount === 2 ? 500 : 50;
                targetX = dirX * baseDist;
                targetZ = dirZ * baseDist;
              }
            }

            const key = isMap
              ? 'map'
              : `${Math.round(targetX)}_${Math.round(targetZ)}`;
            if (!categoryCounts[key]) categoryCounts[key] = 1;
            let x,
              z,
              placed = false,
              attempts = 0;
            while (!placed && attempts < 4000) {
              const n = categoryCounts[key],
                angle = n * 2.39996 + Math.random() * 0.5;
              const localR = (isMap ? 110 : 80) * Math.sqrt(n);
              x = targetX + Math.cos(angle) * localR;
              z = targetZ + Math.sin(angle) * localR;
              categoryCounts[key]++;
              attempts++;

              if (
                colonySDF(
                  x,
                  z,
                  isMap ? rawMapChambers : rawMainChambers,
                  isMap ? rawMapTunnels : rawMainTunnels,
                ) > 16
              ) {
                let overlap = false;
                for (const nd of tArr) {
                  if (
                    Math.abs(x - nd.position.x) < 42 &&
                    Math.abs(z - nd.position.z) < 28
                  ) {
                    overlap = true;
                    break;
                  }
                }
                if (!overlap) {
                  placed = true;
                  const usage = isMap ? chamberUsageMap : chamberUsageMain;
                  const chams = isMap ? rawMapChambers : rawMainChambers;
                  chams.forEach((ch, idx) => {
                    if (Math.hypot(x - ch[0], z - ch[1]) < ch[2] + 40)
                      usage[idx]++;
                  });
                }
              }
            }
            if (placed) createBlock(r, x, z, i, tArr, rawCat, isMap);
            if (i % 10 === 0) {
              fillEl.style.width = (i / total) * 100 + '%';
              await new Promise((res) => setTimeout(res, 1));
            }
          }
          finalizeWorld(chamberUsageMain, chamberUsageMap);
          createPortals();
          setTimeout(() => {
            overlayEl.style.opacity = '0';
            overlayEl.style.visibility = 'hidden';
            isLoaded = true;
          }, 800);
        } catch (e) {
          console.error(e);
        }
      }

      function finalizeWorld(usageMain, usageMap) {
        usageMain[0] = usageMain[5] = 1;
        usageMap[0] = 1;
        const buildActive = (activeIdx, rawChams, rawTuns) => {
          const chams = activeIdx.map((i) => rawChams[i]);
          const mapIdx = {};
          activeIdx.forEach((old, newI) => (mapIdx[old] = newI));
          const tuns = rawTuns
            .filter(([a, b]) => activeIdx.includes(a) && activeIdx.includes(b))
            .map(([a, b, hw]) => [mapIdx[a], mapIdx[b], hw]);
          return { c: chams, t: tuns };
        };
        const mainIdx = usageMain
          .map((u, i) => (u > 0 ? i : -1))
          .filter((i) => i !== -1);
        const mapIdx = usageMap
          .map((u, i) => (u > 0 ? i : -1))
          .filter((i) => i !== -1);
        _mainConfig = buildActive(mainIdx, rawMainChambers, rawMainTunnels);
        _mapConfig = buildActive(mapIdx, rawMapChambers, rawMapTunnels);
        _activeChambers = _mainConfig.c;
        _activeTunnels = _mainConfig.t;
        mainFloorGroup = buildFloorGroup(_mainConfig.c, _mainConfig.t);
        scene.add(mainFloorGroup);
        mapFloorGroup = buildFloorGroup(_mapConfig.c, _mapConfig.t);
        mapFloorGroup.visible = false;
        scene.add(mapFloorGroup);
      }

      function createPortals() {
        const geo = new THREE.CircleGeometry(5, 32),
          mat = () =>
            new THREE.MeshBasicMaterial({
              color: 0x000000,
              transparent: true,
              opacity: 0.5,
            });
        const p2map = new THREE.Mesh(geo, mat());
        p2map.rotation.x = -Math.PI / 2;
        p2map.position.set(rawMainChambers[5][0], 0.1, rawMainChambers[5][1]);
        p2map.userData = {
          isPortal: true,
          dest: 'map',
          targetScale: 1.0,
          currentScale: 1.0,
          targetOpacity: 0.5,
          currentOpacity: 0.5,
        };
        scene.add(p2map);
        mainWorldNodes.push(p2map);
        const p2main = new THREE.Mesh(geo, mat());
        p2main.rotation.x = -Math.PI / 2;
        p2main.position.set(0, 0.1, 0);
        p2main.userData = {
          isPortal: true,
          dest: 'main',
          targetScale: 1.0,
          currentScale: 1.0,
          targetOpacity: 0.5,
          currentOpacity: 0.5,
        };
        p2main.visible = false;
        scene.add(p2main);
        mapWorldNodes.push(p2main);
      }

      function createBlock(
        row,
        x,
        z,
        rowIndex,
        targetArray,
        cat,
        isMapCategory,
      ) {
        const c = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
        const url = c[0]?.replace(/"/g, '').trim(),
          meta = c[2]?.replace(/"/g, '').trim() || '',
          sum = c[3]?.replace(/"/g, '').trim();
        if (!url) return;
        if (!textureCache[rowIndex]) {
          const disp = url
            .replace(/^(https?:\/\/)?(www\.)?/, '')
            .split(/[/?#:]/)[0]
            .toLowerCase();
          const cv = document.createElement('canvas');
          cv.width = 2400;
          cv.height = 1200;
          const ctx = cv.getContext('2d');
          ctx.font = '400 90pt Georgia';
          ctx.fillStyle = '#666666';
          ctx.fillText(meta.toUpperCase(), 80, 120);
          ctx.font = '400 144pt Georgia';
          ctx.fillStyle = 'black';
          ctx.fillText(disp, 80, 280);
          ctx.font = '400 80pt Georgia';
          ctx.fillStyle = '#999999';
          ctx.fillText(cat, 88, 420);
          ctx.font = '400 88pt Georgia';
          ctx.fillStyle = 'black';
          const words = (sum || '').toLowerCase().split(' ');
          let line = '',
            y = 560;
          for (const w of words) {
            const t = line + w + ' ';
            if (ctx.measureText(t).width > 2200 && line.length > 0) {
              ctx.fillText(line, 88, y);
              line = w + ' ';
              y += 112;
            } else line = t;
          }
          ctx.fillText(line, 88, y);
          const tex = new THREE.CanvasTexture(cv);
          tex.minFilter = THREE.LinearFilter;
          tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
          textureCache[rowIndex] = tex;
        }
        const block = new THREE.Mesh(
          blockGeometry,
          new THREE.MeshBasicMaterial({
            map: textureCache[rowIndex],
            transparent: true,
          }),
        );
        block.position.set(x, 0.2, z);
        block.rotation.x = -Math.PI / 2;
        block.userData = {
          url: url.startsWith('http') ? url : 'https://' + url,
          targetScale: 1.0,
          currentScale: 1.0,
          targetOpacity: 1.0,
          currentOpacity: 1.0,
          isPortal: false,
        };
        if (isMapCategory) block.visible = false;
        scene.add(block);
        targetArray.push(block);
      }

      function drawProgress(r) {
        progressCtx.clearRect(0, 0, 128, 128);
        if (r > 0) {
          progressCtx.beginPath();
          progressCtx.lineWidth = 14;
          progressCtx.strokeStyle = '#000000';
          progressCtx.arc(
            64,
            64,
            52,
            -Math.PI / 2,
            -Math.PI / 2 + Math.PI * 2 * r,
          );
          progressCtx.stroke();
        }
        progressTex.needsUpdate = true;
      }

      function drawMinimap() {
        const ms = 200,
          co = ms / 2,
          scale = ms / 6000;
        minimapCtx.clearRect(0, 0, ms, ms);
        minimapCtx.save();
        minimapCtx.translate(co, co);
        minimapCtx.scale(scale, scale);
        minimapCtx.translate(-player.position.x, -player.position.z);
        minimapCtx.fillStyle = '#ffffff';
        minimapCtx.strokeStyle = '#ffffff';
        for (const [a, b, hw] of _activeTunnels) {
          minimapCtx.lineWidth = hw * 2;
          minimapCtx.lineCap = 'round';
          minimapCtx.beginPath();
          minimapCtx.moveTo(_activeChambers[a][0], _activeChambers[a][1]);
          minimapCtx.lineTo(_activeChambers[b][0], _activeChambers[b][1]);
          minimapCtx.stroke();
        }
        for (const [cx, cz, r] of _activeChambers) {
          minimapCtx.beginPath();
          minimapCtx.arc(cx, cz, r, 0, Math.PI * 2);
          minimapCtx.fill();
        }
        activeNodes.forEach((n) => {
          if (n.userData.isPortal) {
            minimapCtx.fillStyle = '#ff0000';
            minimapCtx.fillRect(n.position.x - 30, n.position.z - 30, 60, 60);
          } else {
            minimapCtx.fillStyle = '#000000';
            minimapCtx.fillRect(n.position.x - 10, n.position.z - 10, 20, 20);
          }
        });
        minimapCtx.restore();
        minimapCtx.fillStyle = '#ff0000';
        minimapCtx.fillRect(co - 3, co - 3, 6, 6);
      }

      function switchWorld(dest) {
        activeNodes.forEach((n) => (n.visible = false));
        if (dest === 'map') {
          activeNodes = mapWorldNodes;
          mainFloorGroup.visible = false;
          mapFloorGroup.visible = true;
          _activeChambers = _mapConfig.c;
          _activeTunnels = _mapConfig.t;
        } else {
          activeNodes = mainWorldNodes;
          mainFloorGroup.visible = true;
          mapFloorGroup.visible = false;
          _activeChambers = _mainConfig.c;
          _activeTunnels = _mainConfig.t;
        }
        activeNodes.forEach((n) => (n.visible = true));
        player.position.set(0, 0.5, 0);
        camera.position.set(0, 150, 0);
      }

      function animate() {
        requestAnimationFrame(animate);
        if (!isLoaded) return;
        const s = 4.0;
        isMoving = false;
        let nx = player.position.x,
          nz = player.position.z,
          moved = false;
        if (moveKeys.ArrowUp) {
          nz -= s;
          moved = true;
        }
        if (moveKeys.ArrowDown) {
          nz += s;
          moved = true;
        }
        if (moveKeys.ArrowLeft) {
          nx -= s;
          moved = true;
        }
        if (moveKeys.ArrowRight) {
          nx += s;
          moved = true;
        }
        if (moved) {
          if (isPlayerInside(nx, nz)) {
            player.position.x = nx;
            player.position.z = nz;
            isMoving = true;
          } else if (isPlayerInside(nx, player.position.z)) {
            player.position.x = nx;
            isMoving = true;
          } else if (isPlayerInside(player.position.x, nz)) {
            player.position.z = nz;
            isMoving = true;
          }
        }
        camera.position.set(player.position.x, 150, player.position.z);
        progressMesh.position.set(player.position.x, 1.0, player.position.z);
        updateInteraction();
        for (const node of activeNodes) {
          const u = node.userData;
          if (
            Math.abs(u.targetScale - u.currentScale) > 0.001 ||
            Math.abs(u.targetOpacity - u.currentOpacity) > 0.001
          ) {
            u.currentScale += (u.targetScale - u.currentScale) * 0.15;
            node.scale.set(u.currentScale, u.currentScale, 1);
            u.currentOpacity += (u.targetOpacity - u.currentOpacity) * 0.15;
            node.material.opacity = u.currentOpacity;
          }
        }
        drawMinimap();
        renderer.render(scene, camera);
      }

      function updateInteraction() {
        let target = null;
        for (const n of activeNodes) {
          if (
            player.position.distanceTo(n.position) <
            (n.userData.isPortal ? 14 : 18)
          ) {
            target = n;
            break;
          }
        }
        if (isMoving || !target || isInteractionPaused) {
          if (currentTarget) {
            currentTarget.userData.targetScale = 1.0;
            currentTarget.userData.targetOpacity = currentTarget.userData
              .isPortal
              ? 0.5
              : 1.0;
            currentTarget = null;
          }
          stayStartTime = null;
          progressMesh.material.opacity = 0;
          return;
        }
        const now = Date.now();
        if (!stayStartTime) {
          stayStartTime = now;
          currentTarget = target;
          progressMesh.material.opacity = 1;
        }
        const ratio = Math.min((now - stayStartTime) / 3000, 1.0);
        drawProgress(ratio);
        if (currentTarget) {
          if (currentTarget.userData.isPortal) {
            currentTarget.userData.targetScale = 1.0;
            currentTarget.userData.targetOpacity = 0.5 - 0.25 * ratio;
          } else {
            currentTarget.userData.targetScale = 1.1;
            currentTarget.userData.targetOpacity = 1.0 - 0.5 * ratio;
          }
        }
        if (ratio >= 1.0) {
          if (currentTarget.userData.isPortal)
            switchWorld(currentTarget.userData.dest);
          else window.open(currentTarget.userData.url, '_blank');
          if (currentTarget) {
            currentTarget.userData.targetScale = 1.0;
            currentTarget.userData.targetOpacity = currentTarget.userData
              .isPortal
              ? 0.5
              : 1.0;
          }
          stayStartTime = null;
          currentTarget = null;
          progressMesh.material.opacity = 0;
          isInteractionPaused = true;
        }
      }
    </script>
  </body>
</html>
