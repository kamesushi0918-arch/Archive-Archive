<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Rubik's Cube Mockup</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #f0f0f0;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xf5f5f7);

      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        1000,
      );
      camera.position.set(4.5, 4.5, 6.5);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.6);
      dirLight1.position.set(6, 10, 6);
      dirLight1.castShadow = true;
      dirLight1.shadow.mapSize.width = 2048;
      dirLight1.shadow.mapSize.height = 2048;
      scene.add(dirLight1);

      const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.3);
      dirLight2.position.set(-6, -4, -6);
      scene.add(dirLight2);

      const size = 512;
      const faces = {};

      function createBaseCanvas() {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, size, size);
        return { canvas, ctx };
      }

      const energetic = createBaseCanvas();
      let grad = energetic.ctx.createLinearGradient(0, 0, size, 0);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(1, '#e2df6a');
      energetic.ctx.fillStyle = grad;
      energetic.ctx.fillRect(0, 0, size, size);
      energetic.ctx.fillStyle = '#e5e255';
      const circles = [
        { x: 50, y: 256, r: 35 },
        { x: 180, y: 150, r: 25 },
        { x: 130, y: 400, r: 60 },
        { x: 350, y: 120, r: 45 },
        { x: 450, y: 230, r: 20 },
        { x: 410, y: 380, r: 30 },
        { x: 290, y: 480, r: 50 },
      ];
      circles.forEach((c) => {
        energetic.ctx.beginPath();
        energetic.ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
        energetic.ctx.fill();
      });
      energetic.ctx.save();
      energetic.ctx.translate(350, 256);
      energetic.ctx.rotate(Math.PI / 2);
      energetic.ctx.fillStyle = '#b6b332';
      energetic.ctx.font = 'bold 72px Helvetica, Arial, sans-serif';
      energetic.ctx.textAlign = 'center';
      energetic.ctx.fillText('Ener-', 0, -20);
      energetic.ctx.fillText('getic', 0, 50);
      energetic.ctx.restore();
      energetic.ctx.fillStyle = '#b6b332';
      energetic.ctx.font = '16px Helvetica';
      energetic.ctx.fillText('by Seoul', 30, 310);
      faces.energetic = energetic.canvas;

      const concrete = createBaseCanvas();
      concrete.ctx.fillStyle = '#9e9e9e';
      concrete.ctx.fillRect(0, 0, size, size);
      concrete.ctx.fillStyle = '#7a7a7a';
      concrete.ctx.beginPath();
      concrete.ctx.moveTo(0, 100);
      concrete.ctx.lineTo(size, 240);
      concrete.ctx.lineTo(size, 260);
      concrete.ctx.lineTo(0, 260);
      concrete.ctx.fill();
      concrete.ctx.beginPath();
      concrete.ctx.moveTo(0, 350);
      concrete.ctx.lineTo(size, 250);
      concrete.ctx.lineTo(size, size);
      concrete.ctx.lineTo(0, size);
      concrete.ctx.fill();
      concrete.ctx.fillStyle = '#545454';
      concrete.ctx.font = 'bold 72px Helvetica, Arial, sans-serif';
      concrete.ctx.fillText('Concrete', 30, 280);
      concrete.ctx.fillText('City', 30, 350);
      concrete.ctx.font = '16px Helvetica';
      concrete.ctx.fillText('by Seoul', 420, 480);
      faces.concrete = concrete.canvas;

      const heritage = createBaseCanvas();
      grad = heritage.ctx.createLinearGradient(0, size, 0, 0);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(1, '#97b1a6');
      heritage.ctx.fillStyle = grad;
      heritage.ctx.fillRect(0, 0, size, size);
      heritage.ctx.fillStyle = '#6d8c80';
      heritage.ctx.fillRect(100, 240, 312, 180);
      heritage.ctx.beginPath();
      heritage.ctx.arc(256, 420, 90, Math.PI, 0);
      heritage.ctx.fillStyle = grad;
      heritage.ctx.fill();
      heritage.ctx.fillStyle = '#6d8c80';
      heritage.ctx.fillRect(130, 200, 252, 40);
      heritage.ctx.beginPath();
      heritage.ctx.moveTo(150, 200);
      heritage.ctx.lineTo(110, 160);
      heritage.ctx.lineTo(402, 160);
      heritage.ctx.lineTo(362, 200);
      heritage.ctx.fill();
      heritage.ctx.fillRect(226, 140, 60, 20);
      heritage.ctx.font = 'bold 76px Helvetica, Arial, sans-serif';
      heritage.ctx.fillStyle = '#527064';
      heritage.ctx.fillText('Heritage', 40, 110);
      heritage.ctx.font = '16px Helvetica';
      heritage.ctx.fillText('by Seoul', 430, 490);
      faces.heritage = heritage.canvas;

      const hangang = createBaseCanvas();
      grad = hangang.ctx.createLinearGradient(0, 0, 0, size);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(1, '#9cbcd4');
      hangang.ctx.fillStyle = grad;
      hangang.ctx.fillRect(0, 0, size, size);
      hangang.ctx.fillStyle = '#7ba2c2';
      const bars = [
        { x: 50, y: 150, w: 300, h: 30 },
        { x: 100, y: 200, w: 350, h: 25 },
        { x: 20, y: 260, w: 200, h: 40 },
        { x: 150, y: 320, w: 250, h: 35 },
      ];
      bars.forEach((b) => hangang.ctx.fillRect(b.x, b.y, b.w, b.h));
      hangang.ctx.save();
      hangang.ctx.translate(256, 400);
      hangang.ctx.rotate(Math.PI);
      hangang.ctx.fillStyle = '#4c7496';
      hangang.ctx.font = 'bold 72px Helvetica, Arial, sans-serif';
      hangang.ctx.textAlign = 'center';
      hangang.ctx.fillText('Hangang', 0, -30);
      hangang.ctx.fillText('River', 0, 40);
      hangang.ctx.restore();
      hangang.ctx.fillStyle = '#4c7496';
      hangang.ctx.font = '16px Helvetica';
      hangang.ctx.fillText('by Seoul', 20, 30);
      faces.hangang = hangang.canvas;

      const nature = createBaseCanvas();
      grad = nature.ctx.createLinearGradient(size, 0, 0, 0);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(1, '#436144');
      nature.ctx.fillStyle = grad;
      nature.ctx.fillRect(0, 0, size, size);
      nature.ctx.fillStyle = '#2d472e';
      nature.ctx.beginPath();
      nature.ctx.moveTo(size, 120);
      nature.ctx.lineTo(150, 200);
      nature.ctx.lineTo(size, 320);
      nature.ctx.fill();
      nature.ctx.save();
      nature.ctx.translate(120, 256);
      nature.ctx.rotate(-Math.PI / 2);
      nature.ctx.fillStyle = '#233b24';
      nature.ctx.font = 'bold 72px Helvetica, Arial, sans-serif';
      nature.ctx.textAlign = 'center';
      nature.ctx.fillText('Urban-', 0, -20);
      nature.ctx.fillText('Nature', 0, 50);
      nature.ctx.restore();
      nature.ctx.fillStyle = '#233b24';
      nature.ctx.font = '16px Helvetica';
      nature.ctx.fillText('by Seoul', 430, 30);
      faces.nature = nature.canvas;

      const center = createBaseCanvas();
      center.ctx.fillStyle = '#ffffff';
      center.ctx.fillRect(0, 0, size, size);
      const greyBars = [
        { x: 300, y: 50, w: 120, h: 40, g: ['#888888', '#eeeeee'] },
        { x: 50, y: 120, w: 100, h: 160, g: ['#eeeeee', '#888888'] },
        { x: 420, y: 150, w: 40, h: 100, g: ['#888888', '#ffffff'] },
        { x: 370, y: 220, w: 30, h: 140, g: ['#ffffff', '#666666'] },
        { x: 80, y: 350, w: 60, h: 60, g: ['#999999', '#eeeeee'] },
        { x: 230, y: 380, w: 110, h: 180, g: ['#eeeeee', '#505050'] },
      ];
      greyBars.forEach((b) => {
        let g = center.ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
        g.addColorStop(0, b.g[0]);
        g.addColorStop(1, b.g[1]);
        center.ctx.fillStyle = g;
        center.ctx.fillRect(b.x, b.y, b.w, b.h);
      });
      center.ctx.fillStyle = '#888888';
      center.ctx.font = '16px Helvetica';
      center.ctx.fillText('by Seoul', 420, 480);
      faces.center = center.canvas;

      const textureMaps = {
        energetic: new THREE.CanvasTexture(faces.energetic),
        concrete: new THREE.CanvasTexture(faces.concrete),
        heritage: new THREE.CanvasTexture(faces.heritage),
        hangang: new THREE.CanvasTexture(faces.hangang),
        center: new THREE.CanvasTexture(faces.center),
        nature: new THREE.CanvasTexture(faces.nature),
      };

      const rubikGroup = new THREE.Group();
      scene.add(rubikGroup);

      const cSize = 0.58;
      const gap = 0.02;
      const offset = cSize + gap;
      const blackMaterial = new THREE.MeshStandardMaterial({
        color: 0x111111,
        roughness: 0.5,
      });

      for (let x = 0; x < 3; x++) {
        for (let y = 0; y < 3; y++) {
          for (let z = 0; z < 3; z++) {
            if (x === 1 && y === 1 && z === 1) continue;

            const materials = Array(6).fill(blackMaterial);

            if (x === 2)
              materials[0] = createSubMaterial(
                textureMaps.energetic,
                x,
                y,
                z,
                0,
              );
            if (x === 0)
              materials[1] = createSubMaterial(
                textureMaps.concrete,
                x,
                y,
                z,
                1,
              );
            if (y === 2)
              materials[2] = createSubMaterial(
                textureMaps.heritage,
                x,
                y,
                z,
                2,
              );
            if (y === 0)
              materials[3] = createSubMaterial(textureMaps.hangang, x, y, z, 3);
            if (z === 2)
              materials[4] = createSubMaterial(textureMaps.center, x, y, z, 4);
            if (z === 0)
              materials[5] = createSubMaterial(textureMaps.nature, x, y, z, 5);

            const geom = new THREE.BoxGeometry(cSize, cSize, cSize);
            const cubie = new THREE.Mesh(geom, materials);

            cubie.position.set(
              (x - 1) * offset,
              (y - 1) * offset,
              (z - 1) * offset,
            );

            cubie.castShadow = true;
            cubie.receiveShadow = true;
            rubikGroup.add(cubie);
          }
        }
      }

      function createSubMaterial(baseTexture, x, y, z, faceIndex) {
        const tex = baseTexture.clone();
        tex.needsUpdate = true;

        tex.repeat.set(1 / 3, 1 / 3);

        let u = 0,
          v = 0;
        if (faceIndex === 0) {
          u = 2 - z;
          v = y;
        } else if (faceIndex === 1) {
          u = z;
          v = y;
        } else if (faceIndex === 2) {
          u = x;
          v = 2 - z;
        } else if (faceIndex === 3) {
          u = x;
          v = z;
        } else if (faceIndex === 4) {
          u = x;
          v = y;
        } else if (faceIndex === 5) {
          u = 2 - x;
          v = y;
        }

        tex.offset.set(u / 3, v / 3);

        let r = 0.3,
          m = 0.05;
        if (faceIndex === 1) {
          r = 0.5;
          m = 0.1;
        } else if (faceIndex === 3) {
          r = 0.2;
          m = 0.1;
        } else if (faceIndex === 5) {
          r = 0.4;
        }

        return new THREE.MeshStandardMaterial({
          map: tex,
          roughness: r,
          metalness: m,
        });
      }

      const floorGeo = new THREE.PlaneGeometry(15, 15);
      const floorMat = new THREE.ShadowMaterial({ opacity: 0.12 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -1.8;
      floor.receiveShadow = true;
      scene.add(floor);

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
